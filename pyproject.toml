[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peakcut"
version = "0.3.0"
description = "PeakCut Studio: Autonomous AI Video Clipper & Shorts Pipeline"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
peakcut = "colab_runner:cli_main"

[tool.setuptools]
py-modules = ["app", "main", "colab_runner", "clipmind_runner", "run_transform_pipeline"]

[tool.setuptools.packages.find]
include = [
    "engine", "engine.*", "clipmind", "clipmind.*", "cloud", "cloud.*",
    "anti_reused_pipeline", "anti_reused_pipeline.*", "web", "web.brand",
    "fonts", "assets",
]

[tool.setuptools.package-data]
web = ["*.html", "*.js"]
"web.brand" = ["*.svg", "*.png", "*.jpg"]
fonts = ["*.ttf", "*.conf"]
assets = ["*.png", "*.mp3"]
